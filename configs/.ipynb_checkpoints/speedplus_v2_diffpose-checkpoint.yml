data:
    dataset: "speedplus_v2"
    train_json_path: "/root/autodl-tmp/speedplusv2/synthetic/train.json"
    kpts_mat_path: "/root/autodl-tmp/speedplusv2/kpts.mat"
    gmm_data_path: "/root/autodl-tmp/gmm/resulting/"
    val_json_path: "/root/autodl-tmp/speedplusv2/lightbox/test.json"
    val_gmm_data_path: "/root/autodl-tmp/spacecraft-uda-main/lightbox_2_output/gmm_parameters/"
    num_joints: 11
    num_workers: 32
    use_visibility: True
    visibility_threshold: 0.5
    
    # 混合增强策略 - 已启用数据增强
    augmentation:
        enabled: False  # 启用数据增强
        mode: "mixed"  # 混合模式：基础增强 + 高级增强

        # 基础遮挡增强（训练全程）
        base_augmentation:
            enabled: False  # 启用基础增强
            augment_prob: 0.5              # 50%概率应用基础增强
            min_occluded_joints: 1         # 最少遮挡1个关键点
            max_occluded_joints: 3         # 最多遮挡3个关键点
            uncertainty_scale: 10          # 方差扩大50倍

        # 高级遮挡增强（后期训练，模拟极端情况）
        advanced_augmentation:
            enabled: False  # 启用高级增强
            start_epoch: 30                # 从第30个epoch开始
            augment_prob: 0.3              # 30%概率应用高级增强
            min_occlusion_ratio: 0.4       # 最少遮挡40%
            max_occlusion_ratio: 0.6       # 最多遮挡80%
            uncertainty_scale: 20         # 更高的不确定性
            min_visible_joints: 5          # 至少保留2个可见点

model:
    hid_dim: 96
    emd_dim: 96
    coords_dim: [5, 5]
    num_layer: 5
    n_head: 4
    dropout: 0.25
    n_pts: 11
    ema_rate: 0.999
    ema: True
    resamp_with_conv: True  # ← 必需！用于扩散模型的重采样
    var_type: fixedsmall    # ← 必需！扩散过程的方差类型
    use_visibility_embedding: True

diffusion:
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.001
    num_diffusion_timesteps: 51

training:
    batch_size: 1024
    n_epochs: 200
    num_workers: 32
    use_visibility_mask: True
    
    # 训练策略 - 可选但有用
    curriculum:
        enabled: False                 # 是否使用课程学习
        easy_epochs: 20               # 前期不使用增强的epoch数
        transition_epochs: 10         # 逐渐增加增强的epoch数

testing:
    test_times: 1
    test_timesteps: 2
    test_num_diffusion_timesteps: 24
    use_augmentation: False           # 最终测试时是否使用增强（通常为False）

# 验证集增强配置（训练过程中的验证）
validation:
    use_augmentation: False            # 验证时是否使用增强
    augmentation_mode: "mixed"        # 增强模式：mixed（混合）或 simple（简单）

    # 混合增强策略（与训练类似）
    base_augmentation:
        enabled: False
        augment_prob: 0.5              # 50%概率应用基础增强
        min_occluded_joints: 1
        max_occluded_joints: 3
        uncertainty_scale: 50

    advanced_augmentation:
        enabled: False
        start_epoch: 30                # 从第30个epoch开始
        augment_prob: 0.3              # 30%概率应用高级增强
        min_occlusion_ratio: 0.4
        max_occlusion_ratio: 0.6
        uncertainty_scale: 100
        min_visible_joints: 5

optim:
    decay: 60
    optimizer: "Adam"
    lr: 0.00002
    lr_gamma: 0.9
    eps: 0.00000001
    amsgrad: false  # ← 保留，Adam优化器的变体选项
    grad_clip: 1.0